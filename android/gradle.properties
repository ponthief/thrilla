# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Gradle is not the only JVM this build starts, which is the thing that catches
# people out on a 16GB desktop: the Kotlin compiler runs in a daemon of its own,
# with its own default heap, and Gradle forks a worker per available processor
# on top of that. Add an editor and a browser and the machine is out of memory
# before anything has gone wrong.
#
# So: cap the Kotlin daemon rather than letting it size itself, and hold worker
# parallelism to 2. This costs some wall-clock on a big machine and is the
# difference between building and swapping on a small one. A 32GB+ box can raise
# both — put the overrides in ~/.gradle/gradle.properties, which wins over this
# file, so they do not get committed.
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2

# File-system watching keeps a native watcher and an in-memory tree alive
# between builds. Useful when you build all day; just overhead when you build
# occasionally, which is the case here.
org.gradle.vfs.watch=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Which CPU architectures to package. Every extra one is another copy of the
# native libraries — React Native's, Hermes', Firebase's — packed into the APK.
#
# The default keeps all four because that is what `react-native init` writes,
# and it is the wrong default for this app: x86 and x86_64 exist for emulators,
# and nobody has shipped an x86 phone in a decade. Dropping them halves the
# packaging work and takes tens of megabytes off the APK.
#
# Add x86_64 back when you need an emulator on an Intel machine, either here
# locally or per build:
#   ./gradlew assembleSignetRelease -PreactNativeArchitectures=x86_64
# and see the apk:*:lowmem scripts in package.json, which pass arm64-v8a alone.
reactNativeArchitectures=arm64-v8a,armeabi-v7a

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true
